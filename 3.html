<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> приховані ознаки вигорання</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .course-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 300px; /* Один квадрат, компактный */
            width: 100%;
        }
        .course-image {
            width: 100%;
            height: 200px; /* Увеличено для одного элемента */
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .course-title {
            font-size: 20px;
            margin: 10px 0;
            color: #ce9804;
        }
        .course-price {
            font-size: 18px;
            color: #666;
            margin-bottom: 15px;
        }
        .description {
            margin-bottom: 20px;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 5px;
            font-size: 14px;
            line-height: 1.4;
            display: block; /* Видимое описание */
        }
        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 10px; /* Вертикальный стек кнопок */
        }
        .btn {
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px; /* Расстояние между иконкой и текстом */
            text-decoration: none;
            color: white;
        }
        .telegram-btn {
            background: #0088cc; /* Цвет Telegram */
        }
        .telegram-btn:hover {
            background: #006ba3;
        }
        .direct-btn {
            background: #e4405f; /* Цвет Instagram */
        }
        .direct-btn:hover {
            background: #c1354a;
        }
        .icon {
            width: 20px; /* Размер иконки: 20x20px для компактности */
            height: 20px;
        }
        @media (max-width: 600px) {
            body { padding: 10px; }
            .course-card { padding: 15px; }
        }
    </style>
</head>
<body>

    <div class="course-card">
        <img src="img/3.jpeg" alt="Вигорання" class="course-image">
        <div class="course-title"> У вас  приховані ознаки вигорання</div>
        <div class="course-price" id="score-display">У вас 0 з 200 балів</div>
        <div class="description">Ви можете записатися до мене на консультацію щоб усунути цю проблемму. Записатися можна одним з наданих нижче способів.</div>
        
        <div class="buttons-container">
            <a href="https://t.me/Stec0407" target="_blank" class="btn telegram-btn">
                <img src="img/telegram-icon.png" alt="Telegram" class="icon">
                Телеграмм
            </a>
            <a href="https://www.instagram.com/direct/" target="_blank" class="btn direct-btn">
                <img src="img/instagram-icon.png" alt="Instagram" class="icon">
                Direct
            </a>
        </div>
    </div>

    <script>
        // Для Telegram Mini App: инициализация (если бот настроен)
        // if (window.Telegram && window.Telegram.WebApp) {
        //     window.Telegram.WebApp.ready();
        //     window.Telegram.WebApp.expand(); // Расширить на весь экран
        // }

        // Динамическая вставка баллов из URL-параметров (ожидается ?total_score=XX)
        function updateScoreDisplay() {
            const urlParams = new URLSearchParams(window.location.search);
            const totalScore = urlParams.get('total_score') || '0';
            const maxScore = urlParams.get('max_total') || '200'; // По умолчанию 200 из конфига
            const scoreElement = document.getElementById('score-display');
            if (scoreElement) {
                scoreElement.textContent = `${totalScore} з ${maxScore} балів`;
            }
        }

        // Вызываем при загрузке страницы
        document.addEventListener('DOMContentLoaded', updateScoreDisplay);
    </script>
</body>
</html>
