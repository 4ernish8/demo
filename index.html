<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Курс</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .course-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 300px; /* Один квадрат, компактный */
            width: 100%;
        }
        .course-image {
            width: 100%;
            height: 200px; /* Увеличено для одного элемента */
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .course-title {
            font-size: 20px;
            margin: 10px 0;
            color: #ff6b35;
        }
        .course-price {
            font-size: 18px;
            color: #666;
            margin-bottom: 15px;
        }
        .description {
            margin-bottom: 20px;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 5px;
            font-size: 14px;
            line-height: 1.4;
            display: block; /* Видимое описание */
        }
        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 10px; /* Вертикальный стек кнопок */
        }
        .btn {
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px; /* Расстояние между иконкой и текстом */
            text-decoration: none;
            color: white;
        }
        .buy-btn {
            background: #ff6b35;
        }
        .buy-btn:hover {
            background: #e55a2b;
        }
        .telegram-btn {
            background: #0088cc; /* Цвет Telegram */
        }
        .telegram-btn:hover {
            background: #006ba3;
        }
        .direct-btn {
            background: #e4405f; /* Цвет Instagram */
        }
        .direct-btn:hover {
            background: #c1354a;
        }
        .icon {
            width: 20px; /* Размер иконки: 20x20px для компактности */
            height: 20px;
        }
        @media (max-width: 600px) {
            body { padding: 10px; }
            .course-card { padding: 15px; }
        }
    </style>
</head>
<body>

    <div class="course-card">
        <img src="img/course1.jpg" alt="Курс 1" class="course-image">
        <div class="course-title">Курс 1: Основы</div>
        <div class="course-price">999 ₴</div>
        <div class="description">Описание: Этот курс научит вас основам. Длительность: 10 часов. Включает видео и тесты.</div>
        
        <div class="buttons-container">
            <a href="https://example.com/course1.html" target="_blank" class="btn buy-btn" onclick="handleBuy(event)">
                Купить
            </a>
            <a href="https://t.me/your_bot_username" target="_blank" class="btn telegram-btn">
                <img src="img/telegram-icon.png" alt="Telegram" class="icon">
                Телеграмм
            </a>
            <a href="https://www.instagram.com/direct/" target="_blank" class="btn direct-btn">
                <img src="img/instagram-icon.png" alt="Instagram" class="icon">
                Direct
            </a>
        </div>
    </div>

    <script>
        // Простая обработка для кнопки "Купить" (если нужно что-то дополнительное, например, для Telegram Mini App)
        function handleBuy(event) {
            // Здесь можно добавить логику для Telegram WebApp, например:
            // if (window.Telegram && window.Telegram.WebApp) {
            //     window.Telegram.WebApp.openLink(event.target.href);
            // }
            // event.preventDefault(); // Если используешь WebApp
        }

        // Для Telegram Mini App: инициализация (если бот настроен)
        // if (window.Telegram && window.Telegram.WebApp) {
        //     window.Telegram.WebApp.ready();
        //     window.Telegram.WebApp.expand(); // Расширить на весь экран
        // }
    </script>
</body>
</html>
